# 월별 시즌 키워드 (Layer 1, 신선도 파이프라인)
# daily-run.js 가 오늘 월의 키워드를 시드 후보에 자동 가산한다.
# 매년 반복되는 머니/정책 시즌 흐름. 새 시즌이 임박하면 여기서부터 자동으로 뜬다.
# 새 시즌 이슈 발견 시 해당 월에 한 줄 추가만 하면 내년부터도 자동 가산.

