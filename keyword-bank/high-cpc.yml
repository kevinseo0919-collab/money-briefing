# high-cpc.yml — 고단가 "제도설명형" 키워드 풀 (PR3 추가)
# ─────────────────────────────────────────────────────────────
# ⚠️ cpc_est 는 모두 추정·비공식 수치입니다. 실제 광고단가는 시기·경쟁·매체에 따라
#    ±50% 이상 변동할 수 있으며, 어떤 공식 출처로도 보증되지 않습니다.
# 정체성: 머니브리핑의 "정책·세금·복지" 정보형 톤을 유지한다.
#         순수 상품비교/추천(신용카드 TOP10 등)은 배제하고, "제도설명형"으로만 구성.
# intent: info(정보) / apply(신청) / compare(비교)
# 파서(keyword-free.js·daily-run.js)는 각 항목의 keyword 를 풀에 넣고 cpc_est 로 가중.
# 이미 feed-pool 에 쓴 키워드는 daily-run 이 자동 제외함.

